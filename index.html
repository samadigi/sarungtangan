<html lang="id">
<head>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Aplikasi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100dvh;
      border: 0;
    }
  </style>
</head>

<body>

  <iframe
    src="https://script.google.com/macros/s/AKfycbxe3UxwzevjwKebjNv6-sMvIhMvrcpFqdUWd5m7EovWe_ScJEKjH1WSw0WfNgRk9laTGA/exec"
    allow="camera *; microphone *; geolocation *"
    allowfullscreen>
  </iframe>

</body>
</html>
