<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Web App</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100dvh;
      border: 0;
      background: #fff;
    }
  </style>
</head>

<body>
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbxe3UxwzevjwKebjNv6-sMvIhMvrcpFqdUWd5m7EovWe_ScJEKjH1WSw0WfNgRk9laTGA/exec"
    allow="camera *; microphone *; geolocation *; clipboard-read *; clipboard-write *"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</body>
</html>
